<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 · 업무 연속성 매뉴얼</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="page-narrow">
    <h1>📋 업무 연속성 매뉴얼</h1>
    <p class="subtitle">직원 계정을 만들고 시작하세요</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
      <div class="flash">
        {% for message in messages %}<p>{{ message }}</p>{% endfor %}
      </div>
      {% endif %}
    {% endwith %}

    <div class="card">
      <form class="auth-form" action="{{ url_for('register') }}" method="post">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" value="{{ username }}" minlength="3" required autofocus>

        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" minlength="4" required>

        <label for="password_confirm">비밀번호 확인</label>
        <input type="password" id="password_confirm" name="password_confirm" minlength="4" required>

        <button type="submit">회원가입</button>
      </form>
    </div>

    <p class="auth-switch">이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a></p>
  </div>
</body>
</html>
